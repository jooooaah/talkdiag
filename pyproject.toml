[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "talkdiag"
version = "0.1.0"
description = "Read-only Nextcloud Talk server-side diagnostics CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "talkdiag contributors"}]
dependencies = []

[project.scripts]
talkdiag = "talkdiag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
